# sandboxd 配置：broker 按需创建的临时 Spot VM（一台 VM 只服务一个 chat，用完即删）
# 同一 GCP VPC 内网纯 TCP（不配置 tls）：ingress 只放行 cgm-host tag，egress 全部拒绝。

listen:
  host: 0.0.0.0
  port: 7443

data_dir: /var/lib/cgm   # 启动盘；home 随 VM 删除

launcher: docker
docker:
  bin: docker
  image: ghcr.io/archeb/cybergroupmate:agentic-sandbox
  runtime: runsc
  user: "1000:1000"
  memory: "0"            # 不限制：一台 VM 只服务一个 chat，上限即 VM 规格（agent 可用 runtime.sandboxSize hint）
  cpus: "0"
  pids_limit: 2048
  tmpfs_size: 1g
  nofile: 4096
  extra_args: []

max_sessions: 2           # host 正常只建一个；留一个给断线重连
host_idle_kill_ms: 60000
session_max_lifetime_ms: 86400000
home_ttl_days: 1
keep_skill_generations: 2
max_skills_bytes: 1073741824
